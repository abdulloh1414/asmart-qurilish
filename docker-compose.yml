services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: triumf
      POSTGRES_USER: triumf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD kerak}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triumf -d triumf"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports: ["127.0.0.1:3010:3000"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://triumf:${POSTGRES_PASSWORD}@db:5432/triumf
      COOKIE_SECURE: "true"
      ADMIN_LOGIN: ${ADMIN_LOGIN:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Direktor}

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/triumf-$$(date +%Y%m%d-%H%M).sql.gz
          pg_dump -h db -U triumf triumf | gzip > $$f && echo "zaxira: $$f"
          find /backups -name 'triumf-*.sql.gz' -mtime +14 -delete
          sleep 86400
        done

volumes:
  dbdata:
